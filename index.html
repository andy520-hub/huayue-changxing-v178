*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  --brand:#0E3B45;--brand2:#12616F;--accent:#E3A72F;--ink:#12232A;--sub:#5F7880;

}

    --bg:#081A1F;--card:#0F262C;--line:#1E3A42;--vi:#6FD3C0;--en:#7CC0E8;--th:#CFA0D8;--me:#153540;--them:#12332B;
    --btnbg:#122E35;--tabon:#14343C;--tipbg:#123037;--errbg:#3A1F1C;--errink:#F3A79B;
    --starbg:#3A2F1C;--starink:#EBC777;
    --sd:0 1px 2px rgba(0,0,0,.5),0 10px 26px -18px rgba(0,0,0,.9);
  }
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;overscroll-behavior:none;
  background-image:radial-gradient(circle at 8% -8%,rgba(18,97,111,.10),transparent 44%),radial-gradient(circle at 99% 1%,rgba(227,167,47,.12),transparent 34%);
  background-attachment:fixed}
#app{max-width:640px;margin:0 auto;height:100%;height:100dvh;display:flex;flex-direction:column;padding-bottom:var(--nbres,0px)}
header{position:relative;padding:calc(11px + env(safe-area-inset-top,0px)) 14px 10px;color:#fff;overflow:hidden;
  background:linear-gradient(132deg,#0A2C33 0%,#0E3B45 48%,#155C69 100%)}
header::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.13;
  background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.75) 0 1px,transparent 1px 10px)}
.brand{display:flex;align-items:center;gap:11px;position:relative;z-index:1}

  font-family:"Songti SC",SimSun,serif;font-size:19px;font-weight:700;color:#F4CE7B}
.bt{flex:1;min-width:0}

.ver{font-size:9.5px;color:rgba(255,255,255,.5);letter-spacing:.5px}

/* 顶部常驻搜索 */
.searchbar{padding:9px 12px 3px;position:relative;z-index:15}
.searchbar .wrap{position:relative}
.searchbar input{width:100%;padding:11px 34px 11px 36px;border:1px solid var(--line);border-radius:13px;
  background:var(--card);color:var(--ink);font-size:14px;font-family:inherit;box-shadow:var(--sd);-webkit-appearance:none}
.searchbar input::placeholder{color:var(--sub);opacity:.8}
.searchbar input:focus{outline:none;border-color:var(--brand2);box-shadow:0 0 0 3px rgba(18,97,111,.13)}
.searchbar .ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;
  fill:none;stroke:var(--sub);stroke-width:1.9;stroke-linecap:round;pointer-events:none}
.searchbar .clr{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:24px;height:24px;border:0;border-radius:50%;
  background:var(--tipbg);color:var(--sub);font-size:15px;line-height:1;display:none;place-items:center}
.searchbar .clr.on{display:grid}
#main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 12px 22px;font-size:16px}
#main.fs1{font-size:18px}
#main.fs2{font-size:21px}
.tabbar{display:flex;background:var(--card);border-top:1px solid var(--line);padding:5px 3px calc(5px + env(safe-area-inset-bottom));gap:2px}
.tabbar button{flex:1;border:0;background:none;padding:5px 2px 4px;color:var(--sub);border-radius:11px;
  display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}
.tabbar button svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.tabbar button span{font-size:10.5px;letter-spacing:.3px}
.tabbar button.on{color:var(--brand);background:var(--tabon)}
.tabbar button.on svg{stroke-width:2.1}
.tabbar button.on span{font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 10px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--sub);padding:4px 11px;border-radius:999px;font-size:12.5px}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.sec-title{font-size:13px;color:var(--sub);font-weight:700;margin:4px 2px 7px;letter-spacing:.3px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:9px;box-shadow:var(--sd)}
.pcard.starred{border-color:var(--star);box-shadow:0 0 0 1px var(--star) inset}
.pcard .zh{font-size:1.06em;font-weight:700}
.pcard .vi{font-family:-apple-system,"Segoe UI","Noto Sans",Arial,sans-serif;font-size:1.17em;color:var(--vi);font-weight:700;margin-top:4px;word-break:break-word;line-height:1.32}
.pcard .py{font-size:.75em;color:var(--sub);margin-top:4px;padding-top:4px;border-top:1px dashed var(--line)}
.pcard .acts{display:flex;gap:5px;margin-top:9px;flex-wrap:nowrap}
.pcard .acts button{flex:1 1 0;min-width:0;border:1px solid var(--line);background:var(--btnbg);color:var(--ink);
  padding:7px 2px;border-radius:9px;font-size:13px;min-height:36px;font-family:inherit;white-space:nowrap}
.pcard .acts .btn-play{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.pcard.starred .acts .btn-fav{background:var(--starbg);border-color:var(--star);color:var(--starink);font-weight:600}
.pcard .en{font-size:.8em;color:var(--en);margin-top:4px;word-break:break-word;line-height:1.4}

/* V1.6.0 泰文排版：泰文无词间空格、元音与声调符号最多上下四层堆叠，须单独放行高与字体栈 */
.thtxt{font-family:'Noto Sans Thai','Sarabun','Leelawadee UI','Tahoma',sans-serif;line-height:1.75;font-size:1.08em;letter-spacing:normal;word-break:normal;overflow-wrap:break-word}
.pcard .th{font-size:.84em;color:var(--th);margin-top:3px;word-break:break-word;line-height:1.6}
.pcard .acts .btn-th{background:var(--th);border-color:var(--th);color:#fff;font-weight:600}
.wcard em.th{display:block;font-size:.76em;color:var(--th);font-style:normal;margin-top:4px;word-break:break-word;line-height:1.7}
.r-out.th{color:var(--th)}
.r-out.en{color:var(--en)}
.r-out.thtxt,.pcard .vi.thtxt,.wcard b.thtxt{line-height:1.75}
/* V1.6.0 源/目标语言双选择器 */
.langbar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}
.langbar select{flex:1;min-width:0;padding:9px 8px;border:1px solid var(--line);border-radius:9px;background:var(--btnbg);color:var(--ink);font-size:15px;font-family:inherit}
.langbar .swapnow{flex:0 0 auto;border:1px solid var(--line);background:var(--btnbg);color:var(--brand);border-radius:9px;padding:8px 12px;font-size:17px;min-height:40px}
.lang-note{font-size:12px;color:var(--sub);margin:6px 2px 0}
.sc-tag{display:inline-block;font-size:11px;color:var(--brand);background:var(--tabon);border-radius:6px;padding:1px 7px;margin-left:8px;vertical-align:2px;font-weight:600}
.wgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.wcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:left;min-height:64px}
.wcard b{display:block;font-size:1.12em;color:var(--vi);font-weight:700;word-break:break-word;line-height:1.3}
.wcard span{display:block;font-size:.88em;color:var(--ink);margin-top:3px}
.wcard i{display:block;font-size:.72em;color:var(--sub);font-style:normal;margin-top:3px}
.wcard em.en{display:block;font-size:.74em;color:var(--en);font-style:normal;margin-top:4px;word-break:break-word;line-height:1.4}
.wfull{width:100%}
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:var(--card);margin-bottom:10px}
.listbox,.view{min-height:40vh}
.tip{font-size:13px;color:var(--sub);background:var(--tipbg);border-radius:10px;padding:10px 12px;line-height:1.6}
.tip.err{background:var(--errbg);color:var(--errink)}
.tip.note{margin-bottom:10px}
.warnline{margin-top:10px}
.lbl{display:block;font-size:13px;color:var(--sub);margin:14px 2px 6px;font-weight:600}
textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:1.06em;background:var(--card);resize:none;font-family:inherit}
.trow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.mini,.primary,.swap{border:1px solid var(--line);background:var(--card);padding:10px 16px;border-radius:11px;font-size:15px;color:var(--ink);min-height:42px}
.mini.tog.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
@keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(198,40,40,.55)}50%{box-shadow:0 0 0 9px rgba(198,40,40,0)}}
.mic-live{background:#c62828!important;border-color:#c62828!important;color:#fff!important;font-weight:700;animation:micPulse 1.2s infinite}
.mic-live::before{content:"● ";}
#micMeter{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(72vw,320px);z-index:70;
  background:rgba(38,32,28,.9);border-radius:12px;padding:8px 12px 10px;color:#fff;font-size:12px;display:flex;flex-direction:column;gap:5px}
#micMeter .track{height:8px;border-radius:6px;background:rgba(255,255,255,.18);overflow:hidden}
#micBar{height:100%;width:0;border-radius:6px;background:#4caf50;transition:width .06s linear}
#micBar.hot{background:#ff5252}
#micMeter .lbl{opacity:.85;letter-spacing:.5px}
.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700;flex:1}
.seg{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--card)}
.seg-btn{border:0;background:none;padding:10px 20px;font-size:15px;color:var(--sub)}
.seg-btn.on{background:var(--brand);color:#fff;font-weight:700}
.swrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tres{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:74px}
.r-src{font-size:13px;color:var(--sub)}
.r-out{font-size:1.3em;font-weight:700;color:var(--vi);margin:8px 0;word-break:break-word;line-height:1.35}
.r-acts{display:flex;gap:8px;flex-wrap:wrap}
.r-acts button{border:1px solid var(--line);background:var(--btnbg);padding:9px 15px;border-radius:10px;font-size:14px;min-height:40px}
.r-acts .btn-play{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.calc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:14px 0}
.crow{display:flex;align-items:center;gap:6px;font-size:14px;margin-bottom:8px;flex-wrap:wrap}
.crow input{flex:1;min-width:70px;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:17px;background:var(--btnbg)}
.fsbtn{border:1px solid var(--line);background:var(--btnbg);border-radius:9px;padding:4px 9px;font-size:12px;color:var(--sub);margin-left:auto}
#mask{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:50}
#mask.show{display:flex}
#mask.convmode{padding:0;align-items:stretch;background:var(--bg)}
.modal{background:var(--card);border-radius:16px;padding:18px;max-width:520px;max-height:80vh;overflow:auto}
.modal h3{font-size:17px;margin-bottom:10px;color:var(--brand)}
.modal p{font-size:14px;line-height:1.7;margin-bottom:10px}
.modal .primary{width:100%;margin-top:4px}
.conv{background:var(--bg);width:100%;max-width:560px;height:100%;max-height:100%;display:flex;flex-direction:column;border-radius:0}
.conv-top,.conv-bot{flex:1;display:flex;flex-direction:column;justify-content:center;padding:12px 16px;min-height:0;overflow:auto}
.conv-top{background:var(--card);border-top:2px dashed var(--brand);transform:rotate(180deg)}
.conv-lbl{font-size:11px;color:var(--sub);margin-bottom:6px}
.conv-top .conv-lbl{transform:rotate(180deg)}
.conv-txt{font-size:26px;font-weight:700;line-height:1.35;word-break:break-word}
.conv-top .conv-txt{color:var(--vi)}
.conv-btns{display:flex;gap:8px;margin-top:12px}
.conv-in{background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.conv-row.btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.conv-tip{font-size:12px;color:var(--sub);margin:0 0 8px;line-height:1.5;min-height:18px}
/* V1.7.0 对话模式：双模 + 气泡流。说话方用中性双色，语种色只做竖条 */
.conv-head{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top, 0px)) 12px 8px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
.conv-head-t{flex:1;text-align:center;font-size:13px;font-weight:600;color:var(--brand)}
.conv-modes{display:flex;gap:4px;background:var(--btnbg);border-radius:9px;padding:3px}
.conv-modes button{border:0;background:transparent;color:var(--sub);font-size:12px;padding:5px 10px;border-radius:7px;cursor:pointer}
.conv-modes button.on{background:var(--brand);color:#fff}
.conv-body{flex:1;min-height:0;display:flex;flex-direction:column}
.conv-log{flex:1;min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.conv-log[hidden]{display:none}
.cv-empty{margin:auto;text-align:center;color:var(--sub);font-size:13px;line-height:1.9}
.cbub{position:relative;max-width:88%;border-radius:12px;padding:9px 12px 8px;font-size:14px}
.cbub.me{align-self:flex-start;background:var(--me);border-bottom-left-radius:3px}
.cbub.them{align-self:flex-end;background:var(--them);border-bottom-right-radius:3px}
.cbub-bar{position:absolute;top:10px;bottom:10px;width:3px;border-radius:2px}
.cbub.me .cbub-bar{left:0}
.cbub.them .cbub-bar{right:0}
.cbub-who{font-size:11px;color:var(--sub)}
.cbub-src{font-size:13px;color:var(--ink);opacity:.72;margin-top:4px;word-break:break-word}
.cbub-out{font-size:18px;font-weight:700;line-height:1.45;margin-top:4px;word-break:break-word;color:var(--ink)}
.cbub-out.thtxt{font-size:19px;line-height:1.75}
.cbub-src.thtxt{line-height:1.75}
.cbub-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px}
.cbub-tag{font-size:11px;line-height:1.4}
.cbub-tag.mt{color:var(--errink)}
.cbub-tag.fixed,.cbub-tag.phrase{color:var(--vi)}
.cbub-tag.lib{color:var(--brand)}
.cbub-play{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:7px;padding:2px 8px;font-size:11px;white-space:nowrap}
.conv-face{flex:1;min-height:0;display:flex;flex-direction:column}
.conv-face[hidden]{display:none}
.conv-top{background:var(--them)}
.conv-bot{background:var(--me)}
.cv-who{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.cv-who button{border:1px solid var(--line);background:var(--btnbg);color:var(--sub);border-radius:8px;padding:5px 10px;font-size:12px}
.cv-who button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.cv-micstate{font-size:11px;color:var(--sub);margin-left:auto}
.cv-micstate.mic-live{color:var(--errink)}
.cv-micwrap{display:flex;justify-content:center;padding:6px 0 28px} /* 底部留白：补回提示行移走的高度，麦克风位置不变且不被右下角 Netlify 浮标压住 */
.cvmic{width:62px;height:62px;border-radius:50%;border:0;background:#e24b4a;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.cvmic .cvmic-ico{width:11px;height:17px;border-radius:6px;background:#fff;position:relative}
.cvmic .cvmic-ico:after{content:"";position:absolute;left:-5px;top:8px;width:21px;height:11px;border:2px solid #fff;border-top:0;border-radius:0 0 11px 11px}
.cvmic .cvmic-txt{font-size:11px}
.cvmic:active{opacity:.85}
.cvmic.on{background:#9c3332;box-shadow:0 0 0 6px rgba(226,75,74,.18)}
.cv-guide{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:18px;z-index:9}
.cv-guide .modal{max-height:76vh}

#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(12px);background:rgba(38,32,28,.92);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;max-width:88vw;z-index:60}
#toast.show{opacity:1;transform:translateX(-50%)}
@media(min-width:560px){.wgrid{grid-template-columns:repeat(3,1fr)}}

/* ===== V1.7.2 场景宫格首页 ===== */
.ggrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:2px 0 8px}
.gcard{position:relative;display:flex;flex-direction:column;text-align:left;font-family:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 11px 9px;
  box-shadow:var(--sd);overflow:hidden;overflow-wrap:anywhere}
.gcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand2);opacity:.55}
.gcard.big::before{background:var(--accent);opacity:1}
.gcard.big{border-color:rgba(227,167,47,.5)}
.gcard:active{transform:scale(.985)}
.gcard .no{font-size:10.5px;font-weight:800;letter-spacing:1.1px;color:var(--accent)}
.gcard .nm{font-size:14.5px;font-weight:800;margin-top:2px;letter-spacing:.3px;color:var(--ink);line-height:1.22}
.gcard .st{font-size:10.5px;color:var(--vi);margin-top:2px;opacity:.9;line-height:1.3}
.gcard .ct{font-size:11px;color:var(--sub);margin-top:5px}

/* 场景详情头 */
.schead{display:flex;align-items:center;gap:9px;margin:2px 0 10px}
.back{flex:0 0 auto;width:34px;height:34px;border:1px solid var(--line);border-radius:11px;background:var(--card);
  color:var(--brand);display:grid;place-items:center;box-shadow:var(--sd)}
.back svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.schead .sct{flex:1;min-width:0}
.schead .sch1{font-size:16px;font-weight:800;letter-spacing:.4px;line-height:1.2}
.schead .sch2{font-size:11px;color:var(--sub);margin-top:1px}

/* 隐藏原生 search 清除按钮，避免与自定义清除按钮重复 */
input[type="search"]::-webkit-search-decoration,
input[type="search"]::-webkit-search-cancel-button,
input[type="search"]::-webkit-search-results-button{-webkit-appearance:none;display:none}
/* 朗读按钮在结果区同样用主色 */
.r-acts .btn-play{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}

/* ===== V1.7.6 汇率换算 ===== */
.rate-src{font-size:12px;color:var(--sub);line-height:1.6;margin:2px 2px 10px}
.rate-src.live{color:var(--vi)}
.rate-src.manual{color:var(--starink)}
.rate-amt{width:100%;box-sizing:border-box;font-size:22px;font-weight:800;padding:10px 12px;
  border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font-family:inherit}
.rate-chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px}
.rate-chips button{border:1px solid var(--line);background:var(--btnbg);color:var(--sub);
  border-radius:999px;padding:7px 13px;font-size:12.5px;min-height:42px}
.rate-chips button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.rate-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.rate-cell{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:10px 11px 9px;box-shadow:var(--sd);overflow:hidden;overflow-wrap:anywhere}
.rate-cell::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--rc,var(--brand))}
.rate-cell.me{border-color:var(--brand);background:var(--tabon)}
.rate-cell .rn{font-size:11.5px;color:var(--sub)}
.rate-cell .rv{font-size:17px;font-weight:800;color:var(--ink);margin-top:4px;line-height:1.35;word-break:break-all}
.rate-copy{border:1px solid var(--line);background:var(--btnbg);color:var(--sub);border-radius:7px;
  padding:3px 9px;font-size:11px;margin-top:7px;min-height:30px}
.rate-manual{margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}
.rate-manual[hidden]{display:none}
.rate-manual .crow{margin:6px 0}
.rate-manual input{width:42%;box-sizing:border-box;border:1px solid var(--line);border-radius:9px;
  padding:8px 9px;font-size:15px;background:var(--card);color:var(--ink);font-family:inherit}
.rate-tip{font-size:11.5px;color:var(--sub);line-height:1.6;margin-top:12px}

/* ===== V1.7.7 拍照翻译：近全屏 / 大识别区 / 语种联动 / 底部避让 =====
   V1.7.6 的 .pt-sheet 只有 92vh、图片被 190px 高度上限限成窄条、文字框 78px，
   底部主按钮还压在 Netlify 徽标下。本版整块重排，不动其它组件样式。 */
.pt-modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:flex;align-items:stretch;justify-content:center}
.pt-sheet{background:var(--card);width:100%;max-width:720px;height:100%;height:100dvh;box-sizing:border-box;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 14px calc(84px + env(safe-area-inset-bottom,0px))}
/* 头部 sticky，自带 iPhone 顶部安全区，滚动时不会被状态栏压住 */
.pt-head{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:8px;
  margin:0 -14px 10px;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;
  background:var(--card);border-bottom:1px solid var(--line)}
.pt-head b{font-size:17px;flex:0 0 auto}
.pt-head .pt-step{font-size:11.5px;color:var(--sub);flex:1;text-align:right;line-height:1.4}
.pt-close{border:1px solid var(--line);background:var(--btnbg);color:var(--sub);border-radius:9px;
  min-width:44px;min-height:42px;font-size:20px;flex:0 0 auto}
.pt-help{font-size:12px;color:var(--sub);line-height:1.65;margin:0 0 10px}
.pt-help summary{cursor:pointer;font-weight:700;color:var(--brand);font-size:12.5px;padding:5px 0}
.pt-help p{margin:6px 0}
.pt-pick,.pt-act,.pt-text-acts{display:flex;gap:8px;flex-wrap:wrap}
.pt-pick button,.pt-act button,.pt-text-acts button{border:1px solid var(--line);background:var(--btnbg);
  color:var(--ink);border-radius:10px;padding:9px 13px;font-size:14px;min-height:46px;font-family:inherit}
.pt-pick button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.pt-act{margin-top:10px}
.pt-act .primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700;flex:1 1 190px;font-size:15px}
.pt-act button:disabled{opacity:.55}
.pt-pick input[type=file]{display:none}
/* 图片：全宽大区域，点击全屏放大 */
.pt-shot{position:relative;margin-top:10px;width:100%;height:32vh;min-height:210px;max-height:360px;
  border:1px solid var(--line);border-radius:12px;background:#0b1a20;overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.pt-img{width:100%;height:100%;object-fit:contain;display:block}
.pt-shot[hidden]{display:none}
.pt-badge{position:absolute;bottom:8px;background:rgba(0,0,0,.66);color:#fff;
  font-size:11px;padding:4px 9px;border-radius:8px;pointer-events:none}
.pt-meta{left:8px}.pt-zoom{right:8px}
.pt-viewer{position:fixed;inset:0;background:#000;z-index:120;display:flex;align-items:center;justify-content:center}
.pt-viewer img{max-width:100%;max-height:100%;object-fit:contain}
/* 语种 chip：OCR 语种与翻译原文语种共用同一个值，杜绝 V1.7.6 两个下拉互相打架 */
.pt-lbl{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:14px 0 7px}
.pt-lbl b{font-size:13.5px;color:var(--ink)}
.pt-lbl span{font-size:11.5px;color:var(--sub)}
.pt-langs{display:flex;gap:7px;flex-wrap:wrap}
.pt-langs button{flex:1 1 auto;min-width:64px;min-height:44px;border:1px solid var(--line);
  background:var(--btnbg);color:var(--ink);border-radius:10px;font-size:14px;font-family:inherit;padding:8px 7px}
.pt-langs button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.pt-prog{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 5px}
.pt-prog i{display:block;height:100%;width:0;background:var(--brand);transition:width .2s}
.pt-status{font-size:12px;color:var(--sub);line-height:1.55;margin:5px 0}
.pt-warn{display:none;margin:8px 0 2px;padding:10px 11px;border-radius:10px;font-size:12.5px;
  line-height:1.65;color:var(--errink);background:var(--errbg);border:1px solid var(--line)}
.pt-warn.on{display:block}
/* 识别文字：16px 防 iOS 自动缩放，最小 156px，比旧版 78px 大一倍 */
.pt-text{width:100%;box-sizing:border-box;min-height:156px;border:1px solid var(--line);border-radius:12px;
  padding:10px;font-size:16px;line-height:1.65;background:var(--card);color:var(--ink);font-family:inherit}
.pt-text-acts{margin-top:7px}
.pt-text-acts button{min-height:38px;padding:5px 12px;font-size:12.5px;color:var(--sub)}
.pt-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 11px;
  margin-bottom:8px;position:relative;overflow:hidden}
.pt-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--rc,var(--brand))}
.pt-card h4{margin:0 0 5px;font-size:12px;color:var(--sub);font-weight:700}
.pt-card p{margin:0;font-size:15px;line-height:1.65;white-space:pre-wrap;word-break:break-word;color:var(--ink)}
.pt-acts{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
.pt-acts button{border:1px solid var(--line);background:var(--btnbg);color:var(--sub);
  border-radius:8px;padding:4px 10px;font-size:12px;min-height:34px;font-family:inherit}
.pt-tag{display:inline-block;font-size:10.5px;color:var(--errink);background:var(--errbg);
  border-radius:6px;padding:2px 7px}
</style>
</head>

<script data-page-node-id="4J3pdAwELs3Jh8JQYWwghn" data-pnid-children="knjs0k61bj0x2fwvXBcTWG">
/* 应用逻辑：依赖数据文件中的 SCENES / SENT4 / VOCAB / MONEY / APP_VER / APP_DATE */
'use strict';

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

const FAV_KEY = 'vnAssistFavV1';
const HIST_KEY = 'vnAssistHistV1';
const OPT_KEY = 'vnAssistOptV1';
const state = {
  tab: 'scene',
  scene: SCENES[0].id,
  sceneOpen: false,
  vocab: VOCAB[0].id,
  q: '',
  dir: 'zh2vi',
  fav: loadFav(),
  hist: loadHist(),
  opt: loadOpt()
};

function loadOpt() {
  try { return Object.assign({ auto: true, fs: 0 }, JSON.parse(localStorage.getItem(OPT_KEY) || '{}')); } catch (e) { return { auto: true, fs: 0 }; }
}
function saveOpt() {
  try { localStorage.setItem(OPT_KEY, JSON.stringify(state.opt)); } catch (e) {}
}
function loadHist() {
  try { const a = JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); return Array.isArray(a) ? a.filter(x => Array.isArray(x) && x.length >= 2) : []; } catch (e) { return []; }
}
function saveHist() {
  try { localStorage.setItem(HIST_KEY, JSON.stringify(state.hist.slice(0, 20))); } catch (e) {}
}
function pushHist(zh, vi, lang) {
  if (!zh || !vi) return;
  const i = state.hist.findIndex(x => x[0] === zh);
  if (i >= 0) state.hist.splice(i, 1);
  state.hist.unshift([zh, vi, lang]);
  state.hist = state.hist.slice(0, 20);
  saveHist();
}

function loadFav() {
  try { const a = JSON.parse(localStorage.getItem(FAV_KEY) || '[]'); return Array.isArray(a) ? a.filter(x => Array.isArray(x) && x.length >= 3) : []; } catch (e) { return []; }
}
function saveFav() {
  try { localStorage.setItem(FAV_KEY, JSON.stringify(state.fav)); } catch (e) { /* 隐私模式忽略 */ }
}
function favOf(zh) { return state.fav.find(x => x[0] === zh); }
function isFav(zh) { return !!favOf(zh); }
function toggleFav(zh, vi, py, lang, en, th) {
  const i = state.fav.findIndex(x => x[0] === zh);
  if (i >= 0) state.fav.splice(i, 1);
  else state.fav.push([zh, vi, py, lang, en, th]);
  saveFav();
  return i < 0;
}

/* ---------- 语音朗读 ---------- */
let voices = [];
function loadVoices() { voices = window.speechSynthesis ? speechSynthesis.getVoices() : []; }
if ('speechSynthesis' in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
function pickVoice(lang) {
  if (!voices.length) return null;
  const p = { vi:'vi', en:'en', th:'th', zh:'zh' }[lang] || 'zh';
  return voices.find(v => new RegExp('^' + p, 'i').test(v.lang)) || null;
}
function speak(text, lang, slow) {
  if (!('speechSynthesis' in window)) { toast('本机浏览器不支持朗读，请用 Chrome/Edge 打开'); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = LANGS[lang] ? LANGS[lang].tts : 'zh-CN';
  const v = pickVoice(lang);
  if (v) u.voice = v;
  else if (lang === 'vi') toast('未装越南语音包，发音可能不准（Win：设置→时间和语言→语音→添加语音）');
  else if (lang === 'th') toast('未装泰语音包，发音可能不准（Win：设置→时间和语言→语音→添加语音）');
  u.rate = slow ? 0.55 : 0.92;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

/* ---------- 提示条 ---------- */
let toastTimer = null;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ---------- 语句卡片 ---------- */
function phraseCard(zh, vi, py, lang, en, th) {
  lang = lang || 'vi';
  const starred = isFav(zh);
  const d = document.createElement('div');
  d.className = 'pcard' + (starred ? ' starred' : '');
  d.innerHTML =
    '<div class="zh"></div>' +
    '<div class="vi"></div>' +
    (en ? '<div class="en"></div>' : '') +
    (th ? '<div class="th"></div>' : '') +
    '<div class="py"></div>' +
    '<div class="acts">' +
    '<button class="btn-play" type="button">朗读</button>' +
    '<button class="btn-slow" type="button">慢速</button>' +
    (en ? '<button class="btn-en" type="button">英</button>' : '') +
    (th ? '<button class="btn-th" type="button">泰</button>' : '') +
    '<button class="btn-copy" type="button">复制</button>' +
    '<button class="btn-fav" type="button">' + (starred ? '已收藏' : '收藏') + '</button>' +
    '</div>';
  $('.zh', d).textContent = zh;
  $('.vi', d).textContent = vi;
  if (en) $('.en', d).textContent = 'EN: ' + en;
  if (th) { const el = $('.th', d); el.textContent = 'TH: ' + th; el.classList.add('thtxt'); el.lang = 'th'; }
  $('.py', d).textContent = py ? '谐音 ' + py : '';
  $('.btn-play', d).onclick = () => { speak(vi, lang); pushHist(zh, vi, lang); };
  $('.btn-slow', d).onclick = () => { speak(vi, lang, true); pushHist(zh, vi, lang); };
  if (en) $('.btn-en', d).onclick = () => { speak(en, 'en'); pushHist(zh, en, 'en'); };
  if (th) $('.btn-th', d).onclick = () => { speak(th, 'th'); pushHist(zh, th, 'th'); };
  $('.btn-copy', d).onclick = () => copyText(zh + '\n' + vi + (py ? '\n' + py : '') + (en ? '\n' + en : '') + (th ? '\n' + th : ''));
  $('.btn-fav', d).onclick = () => {
    const on = toggleFav(zh, vi, py, lang, en, th);
    d.classList.toggle('starred', on);
    $('.btn-fav', d).textContent = on ? '已收藏' : '收藏';
    toast(on ? '已加入收藏' : '已移出收藏');
    if (state.tab === 'fav') renderTab();
  };
  return d;
}
function copyText(txt) {
  const ta = document.createElement('textarea');
  ta.value = txt;
  ta.style.cssText = 'position:fixed;left:-999px;top:0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  if (!ok && navigator.clipboard) navigator.clipboard.writeText(txt).then(() => toast('已复制'), () => toast('复制失败，请长按选择'));
  else toast(ok ? '已复制' : '复制失败，请长按选择');
}

/* ---------- 场景 tab ---------- */
function allScenes() { return SCENES.concat(SENT4); }
function renderSceneView(host) {
  const scs = allScenes();

  /* ---- 第一层：12 组场景宫格 ---- */
  if (!state.sceneOpen) {
    const t = document.createElement('div');
    t.className = 'sec-title';
    t.textContent = '全部场景 · ' + scs.length + ' 组';
    host.appendChild(t);

    const g = document.createElement('div');
    g.className = 'ggrid';
    scs.forEach((sc, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'gcard' + (sc.items.length >= 100 ? ' big' : '');
      b.innerHTML = '<span class="no"></span><span class="nm"></span>' +
        (sc.title ? '<span class="st"></span>' : '') + '<span class="ct"></span>';
      $('.no', b).textContent = ('0' + (i + 1)).slice(-2);
      $('.nm', b).textContent = sc.name;
      if (sc.title) $('.st', b).textContent = sc.title;
      $('.ct', b).textContent = sc.items.length + ' 句';
      b.onclick = () => {
        state.scene = sc.id; state.sceneOpen = true; state.q = '';
        syncGlobalInput(); renderTab();
      };
      g.appendChild(b);
    });
    host.appendChild(g);

    const note = document.createElement('div');
    note.className = 'tip note';
    note.textContent = '越南语有 6 个声调，谐音只能近似；开口前先点「朗读」听标准发音，配合手势、指着实物或用 Zalo 发文字最稳。';
    host.appendChild(note);
    return;
  }

  /* ---- 第二层：单组句子的详情页 ---- */
  const sc = scs.find(x => x.id === state.scene) || scs[0];
  state.scene = sc.id;

  const head = document.createElement('div');
  head.className = 'schead';
  head.innerHTML = '<button class="back" type="button" aria-label="返回场景">' +
    '<svg viewBox="0 0 24 24"><path d="M15 4.5 7.5 12 15 19.5"/></svg></button>' +
    '<div class="sct"><div class="sch1"></div><div class="sch2"></div></div>';
  $('.back', head).onclick = () => { state.sceneOpen = false; state.q = ''; syncGlobalInput(); renderTab(); };
  $('.sch1', head).textContent = sc.name;
  $('.sch2', head).textContent = (sc.title ? sc.title + ' · ' : '') + sc.items.length + ' 句';
  host.appendChild(head);

  const kw = state.q;
  let items = sc.items;
  if (kw) {
    const low = kw.toLowerCase();
    items = sc.items.filter(it => it[0].includes(kw) ||
      String(it[1]).toLowerCase().includes(low) || String(it[2]).includes(kw) ||
      String(it[3] || '').toLowerCase().includes(low) || String(it[4] || '').includes(kw));
  }

  const box = document.createElement('div');
  box.className = 'listbox';
  host.appendChild(box);

  if (!items.length) {
    const t = document.createElement('div');
    t.className = 'tip';
    t.textContent = kw ? '本组里没有匹配「' + kw + '」的句子，清空搜索可看全部。' : '这组句子还没录入。';
    box.appendChild(t);
    return;
  }
  items.forEach(it => box.appendChild(phraseCard(it[0], it[1], it[2], 'vi', it[3], it[4])));
}

/* ---------- 词库 tab ---------- */
function renderVocabView(host) {
  const chips = document.createElement('div');
  chips.className = 'chips';
  const note = document.createElement('div');
  note.className = 'tip note';
  note.textContent = '词库是积木：动词+名词自己拼短句，如 kiểm tra（检查）+ máy（机器）= kiểm tra máy（检查机器）。开口先称呼：男员工 anh（安）、女员工 chị（芝）、比自己小 em（恩）、领导 sếp（塞普）。点卡片即朗读。';
  const h = document.createElement('div');
  h.className = 'sec-title';
  const grid = document.createElement('div');
  grid.className = 'wgrid';
  host.appendChild(chips);
  host.appendChild(note);
  host.appendChild(h);
  host.appendChild(grid);

  const paint = () => {
    const g = VOCAB.find(x => x.id === state.vocab) || VOCAB[0];
    state.vocab = g.id;
    $$('.chip', chips).forEach(b => b.classList.toggle('on', b.dataset.id === g.id));
    h.textContent = g.name + ' · ' + g.items.length + ' 词（谐音仅近似）';
    grid.innerHTML = '';
    g.items.forEach(it => {
      const c = document.createElement('button');
      c.type = 'button';
      c.className = 'wcard';
      c.innerHTML = '<b></b><span></span><i></i>' + (it[3] ? '<em class="en"></em>' : '') + (it[4] ? '<em class="th"></em>' : '');
      $('b', c).textContent = it[0];
      $('span', c).textContent = it[2];
      $('i', c).textContent = it[1];
      c.onclick = () => { speak(it[0], 'vi'); pushHist(it[2], it[0]); };
      if (it[3]) { const em = $('em.en', c); em.textContent = 'EN: ' + it[3]; em.onclick = e => { e.stopPropagation(); speak(it[3], 'en'); pushHist(it[2], it[3], 'en'); }; }
      if (it[4]) { const em = $('em.th', c); em.textContent = 'TH: ' + it[4]; em.classList.add('thtxt'); em.lang = 'th'; em.onclick = e => { e.stopPropagation(); speak(it[4], 'th'); pushHist(it[2], it[4], 'th'); }; }
      grid.appendChild(c);
    });
  };
  VOCAB.forEach(g => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.dataset.id = g.id;
    b.textContent = g.name;
    b.onclick = () => {
      if (state.vocab !== g.id) { state.vocab = g.id; paint(); }
    };
    chips.appendChild(b);
  });
  paint();
}

/* ---------- 搜索 tab ---------- */
function renderSearchView(host) {
  /* 顶部已有常驻搜索框时，这里不再重复放一个 */
  const hasTop = !!$('#qGlobal');
  let inp = null;
  if (!hasTop) {
    inp = document.createElement('input');
    inp.className = 'search';
    inp.type = 'search';
    inp.placeholder = '输入中文或越南文关键词，如：不良、返工、多少钱';
    inp.value = state.q;
    host.appendChild(inp);
  }

  const box = document.createElement('div');
  box.className = 'listbox';
  host.appendChild(box);

  const doSearch = () => {
    if (inp) state.q = inp.value.trim();
    box.innerHTML = '';
    if (!state.q) {
      const t = document.createElement('div');
      t.className = 'tip';
      t.textContent = '输入关键词后，全部场景一起搜。支持中文、越南文、谐音三种写法。';
      box.appendChild(t);
      return;
    }
    const kw = state.q.toLowerCase();
    const hit = [];
    allScenes().forEach(s => s.items.forEach(it => {
      if (it[0].includes(state.q) || String(it[1]).toLowerCase().includes(kw) || String(it[2]).includes(state.q) ||
          String(it[3] || '').toLowerCase().includes(kw) || String(it[4] || '').includes(state.q)) {
        hit.push([s.name, it]);
      }
    }));
    const vhit = [];
    VOCAB.forEach(g => g.items.forEach(it => {
      if (it[0].toLowerCase().includes(kw) || it[1].includes(state.q) || it[2].includes(state.q)) {
        vhit.push([g.name, it]);
      }
    }));
    const CAP = 50;
    const vShow = vhit.slice(0, CAP);
    const hShow = hit.slice(0, Math.max(0, CAP - vShow.length));
    const t = document.createElement('div');
    t.className = 'sec-title';
    t.textContent = '搜索结果 · 句子 ' + hit.length + ' 条 + 词 ' + vhit.length + ' 条' + (hit.length + vhit.length > CAP ? '（仅显示前 ' + CAP + ' 条）' : '');
    box.appendChild(t);
    if (!hit.length && !vhit.length) {
      const e = document.createElement('div');
      e.className = 'tip';
      e.textContent = '没找到，换个关键词试试；或用「互译」tab 现翻。';
      box.appendChild(e);
      return;
    }
    vShow.forEach(([name, it]) => {
      const c = document.createElement('button');
      c.type = 'button';
      c.className = 'wcard wfull';
      c.innerHTML = '<b></b><span></span><i></i>' + (it[3] ? '<em class="en"></em>' : '') + (it[4] ? '<em class="th"></em>' : '');
      $('b', c).textContent = it[0];
      $('span', c).textContent = it[2];
      $('i', c).textContent = it[1] + ' · ' + name;
      c.onclick = () => { speak(it[0], 'vi'); pushHist(it[2], it[0]); };
      if (it[3]) { const em = $('em.en', c); em.textContent = 'EN: ' + it[3]; em.onclick = e => { e.stopPropagation(); speak(it[3], 'en'); pushHist(it[2], it[3], 'en'); }; }
      if (it[4]) { const em = $('em.th', c); em.textContent = 'TH: ' + it[4]; em.classList.add('thtxt'); em.lang = 'th'; em.onclick = e => { e.stopPropagation(); speak(it[4], 'th'); pushHist(it[2], it[4], 'th'); }; }
      box.appendChild(c);
    });
    hShow.forEach(([name, it]) => {
      const c = phraseCard(it[0], it[1], it[2], 'vi', it[3], it[4]);
      const tag = document.createElement('span');
      tag.className = 'sc-tag';
      tag.textContent = name;
      $('.zh', c).appendChild(tag);
      box.appendChild(c);
    });
  };
  if (inp) {
    let tm = null;
    inp.oninput = () => { clearTimeout(tm); tm = setTimeout(doSearch, 220); };
  }
  doSearch();
}

/* ---------- 语言识别 ---------- */
const VI_CHARS = 'ăâđêôơưàáảãạằắẳẵặầấẩẫậèéẻẽẹềếểễệìíỉĩịòóỏõọồốổỗộờớởỡợùúủũụừứửữựỳýỷỹỵ';
function detectLang(t) {
  if (!t) return 'other';
  if (/[\u4e00-\u9fff]/.test(t)) return 'zh';
  if (/[\u0e00-\u0e7f]/.test(t)) return 'th';
  const low = t.toLowerCase();
  let viHit = 0;
  for (const ch of low) if (VI_CHARS.indexOf(ch) >= 0) viHit++;
  if (viHit > 0) return 'vi';
  if (/[a-z]/i.test(t)) return 'latin';
  return 'other';
}

/* ---------- V1.6.0 四语种表（方向统一用 '<from>2<to>'，如 zh2th） ----------
   百度语种码依据：百度翻译开放平台《通用文本翻译API-接入文档》常见语种列表（zh / vie / en / th）。
   MyMemory 语种码：本次实测 zh-CN|th-TH 可用；Web Speech 语音码 th-TH 见 WICG 端侧识别语言列表。 */
var LANGS = {

  en: { name:'英语',   baidu:'en',  my:'en-US', tts:'en-US', label:'输入英文（递给对方打字/说话）', ph:'请对方输入，或粘贴对方发来的文字' },
  th: { name:'泰语',   baidu:'th',  my:'th-TH', tts:'th-TH', label:'输入泰文（递给泰国同事打字/说话）', ph:'请泰国同事输入，或粘贴对方发来的文字' }
};
var LANG_KEYS = ['zh','vi','en','th'];
function dirFrom(d) { return String(d || 'zh2vi').split('2')[0]; }
function dirTo(d)   { return String(d || 'zh2vi').split('2')[1] || 'vi'; }
function dirToLang(d) { return dirFrom(d); }  // 语音识别跟随「源语言」
function langOf(k) { return LANGS[k] || LANGS.zh; }

    '<button type="button" class="mini" id="hintBtn">语音说不了？看这里</button>' +
    '</div>' +
    '<label class="lbl">结果</label>' +
    '<div class="tres" id="resBox"><div class="tip">翻译结果会显示在这里，可朗读、可复制。</div></div>' +
    '<div class="tip warnline">机翻结果仅供参考。重要内容（安全、品质判定、金额承诺）请用场景库固定语句或与对方确认，别只靠机翻。</div>' +
    '<div class="sec-title" style="margin-top:16px">最近用过</div>' +
    '<div class="listbox" id="histBox"></div>';

  const optsHtml = sel => LANG_KEYS.map(k => '<option value="' + k + '"' + (k === sel ? ' selected' : '') + '>' + LANGS[k].name + '</option>').join('');
  const fillSel = () => {
    const f = dirFrom(state.dir), t = dirTo(state.dir);
    $('#fromSel', host).innerHTML = optsHtml(f);
    $('#toSel', host).innerHTML = optsHtml(t);
    const cross = f !== 'zh' && t !== 'zh';
    $('#dirNote', host).textContent = '当前：' + LANGS[f].name + ' → ' + LANGS[t].name
      + (cross ? ' · 跨外语方向为机翻初稿，请人工确认' : '（4 语种共 12 种方向）');
  };
  const setDir = (d, quiet) => {
    if (dirFrom(d) === dirTo(d)) { fillSel(); return; }
    const changed = state.dir !== d;
    state.dir = d;
    fillSel();
    const f = dirFrom(d);
    $('#srcLbl', host).textContent = LANGS[f].label;
    $('#srcTa', host).placeholder = LANGS[f].ph;
    const taEl = $('#srcTa', host);
    if (f === 'th') { taEl.lang = 'th'; taEl.classList.add('thtxt'); }
    else { taEl.lang = f; taEl.classList.remove('thtxt'); }
    if (changed && !quiet) clearOut();
  };
  setDirQuiet = d => setDir(d, true);
  $('#fromSel', host).onchange = () => {
    const f = $('#fromSel', host).value;
    let t = dirTo(state.dir);
    if (t === f) t = (f === 'zh' ? 'vi' : 'zh');
    setDir(f + '2' + t);
  };
  $('#toSel', host).onchange = () => {
    const t = $('#toSel', host).value;
    let f = dirFrom(state.dir);
    if (f === t) f = (t === 'zh' ? 'vi' : 'zh');
    setDir(f + '2' + t);
  };

  const resBox = $('#resBox', host);
  const clearOut = () => { resBox.innerHTML = '<div class="tip">翻译结果会显示在这里，可朗读、可复制。</div>'; lastSrc = lastOut = lastDir = ''; };

  $('#swapBtn', host).onclick = () => {
    setDir(dirTo(state.dir) + '2' + dirFrom(state.dir));
    $('#srcTa', host).value = '';
    clearOut();
    $('#srcTa', host).focus();
  };
  $('#goBtn', host).onclick = () => doTranslate(resBox);
  $('#clrBtn', host).onclick = () => { $('#srcTa', host).value = ''; clearOut(); };
  $('#hintBtn', host).onclick = showMicGuide;
  $('#micBtn', host).onclick = () => startDictation($('#srcTa', host), txt => { autoPickDir(txt); doTranslate(resBox); }, null, $('#micBtn', host));
  $('#convBtn', host).onclick = openConv;
  $('#autoBtn', host).onclick = () => {
    state.opt.auto = !state.opt.auto; saveOpt();
    $('#autoBtn', host).textContent = '输入即译：' + (state.opt.auto ? '开' : '关');
    $('#autoBtn', host).classList.toggle('on', state.opt.auto);
    toast(state.opt.auto ? '停止输入 0.9 秒后自动翻译（需联网）' : '已关闭自动翻译，点「翻译」按钮才发起请求');
  };

  const ta = $('#srcTa', host);
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doTranslate(resBox); }
  });
  let at = null;
  ta.addEventListener('input', () => {
    const v = ta.value;
    autoPickDir(v);
    if (!state.opt.auto) return;
    clearTimeout(at);
    if (v.trim().length < 2) return;
    at = setTimeout(() => { if (v.trim() !== lastSrc) doTranslate(resBox, true); }, 900);
  });

  $('#photoBtn', host).onclick = openPhotoTrans;
  renderHist($('#histBox', host));
  setDir(state.dir, true);
}

function autoPickDir(v) {
  const map = { zh:'zh', vi:'vi', latin:'en', th:'th' };
  const f = map[detectLang(v)];
  if (!f) return;
  let t = dirTo(state.dir);
  if (t === f) t = (f === 'zh' ? 'vi' : 'zh');
  setDirQuiet(f + '2' + t);
}
let setDirQuiet = () => {};

function renderHist(box) {
  box.innerHTML = '';
  if (!state.hist.length) {
    const t = document.createElement('div');
    t.className = 'tip';
    t.textContent = '翻过的句子会留在这里（最近 20 条），现场反复用同一句时不用再打一遍。';
    box.appendChild(t);
    return;
  }
  state.hist.forEach(it => box.appendChild(phraseCard(it[0], it[1], '', it[2] || 'vi', '', '')));
  const bar = document.createElement('div');
  bar.className = 'trow';
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'mini';
  b.textContent = '清空最近使用';
  b.onclick = () => { state.hist = []; saveHist(); renderHist(box); toast('已清空'); };
  bar.appendChild(b);
  box.appendChild(bar);
}

/* ---------- V1.7.0 对话模式：气泡流 / 对面屏 双模，共用同一份会话数组 ----------
   说话方用中性双色 --me / --them；语种色 --vi/--en/--th 只做气泡竖条，避免语义冲突。
   左右对齐 + 「我 / 对方」文字标签同时存在，不单靠颜色区分（WCAG 2.1 SC 1.4.11）。 */
function escHtml(x) {
  return String(x == null ? '' : x).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
/* 场景库条目：越南语列是原版人工语料；英文/泰文列是机翻初稿，标记必须区分，不冒充固定译法 */
function convLib(zhText, cvF) {
  const col = { vi:1, en:3, th:4 }[cvF];
  const q = (zhText || '').trim();
  if (col === undefined || !q) return { out:'', kind:'' };
  let out = '';
  const scan = arr => (arr || []).forEach(sec => (sec.items || []).forEach(it => {
    if (!out && it[0] && String(it[0]).trim() === q && it[col]) out = it[col];
  }));
  scan(SC_A); scan(SC_B); scan(SC_C); scan(SC_D); scan(SENT4);
  if (!out) return { out:'', kind:'' };
  return { out: out, kind: cvF === 'vi' ? 'fixed' : 'lib' };
}
function openConv() {
  const m = $('#mask');
  let cvF = (dirFrom(state.dir) !== 'zh' ? dirFrom(state.dir) : dirTo(state.dir));
  if (cvF === 'zh') cvF = 'vi';
  const fName = LANGS[cvF].name;
  let mode = 'bubble';
  try { mode = localStorage.getItem('hy_conv_mode') === 'face' ? 'face' : 'bubble'; } catch (e) {}
  const log = [];
  let speakerLang = 'zh';  // Web Speech 必须显式指定 lang，无法自动判语种；由「我 / 对方」chip 决定

  m.innerHTML =
    `<div class="conv">
      <div class="conv-head">
        <button type="button" class="mini" id="cvClose">关闭</button>
        <div class="conv-head-t">中文 ⇄ ${fName}</div>
        <div class="conv-modes">
          <button type="button" data-mode="bubble">气泡流</button>
          <button type="button" data-mode="face">对面屏</button>
        </div>
      </div>
      <div class="conv-body">
        <div class="conv-log" id="cvLog"></div>
        <div class="conv-face" id="cvFace" hidden>
          <div class="conv-top">
            <div class="conv-lbl">${fName}（给对方看，字是倒的）</div>
            <div class="conv-txt vi-txt"></div>
            <div class="conv-btns">
              <button type="button" class="mini" id="cvPlayVi">朗读</button>
              <button type="button" class="mini" id="cvPlayViSlow">慢速</button>
            </div>
          </div>
          <div class="conv-bot">
            <div class="conv-lbl">中文（你这边）</div>
            <div class="conv-txt zh-txt"></div>
          </div>
        </div>
      </div>
      <div class="conv-in">
        <div class="cv-who">
          <button type="button" id="cvWhoMe" class="on">我说中文</button>
          <button type="button" id="cvWhoThem">对方说${fName}</button>
          <span class="cv-micstate" id="cvMicState">麦克风待命</span>
        </div>
        <div class="conv-tip" id="cvTip">气泡按说话方分色：浅棕=你、灰绿=对方；语种色只做竖条。</div>
        <div class="conv-row"><textarea id="cvTa" rows="1" placeholder="打字，或点下方圆形按钮说话"></textarea></div>
        <div class="conv-row btns">
          <button type="button" class="mini" id="cvClear">清空对话</button>
          <button type="button" class="primary" id="cvGo">翻译并显示</button>
        </div>
        <div class="cv-micwrap">
          <button type="button" class="cvmic" id="cvMicBig" title="点一下开始说话，再点一下结束">
            <span class="cvmic-ico"></span><span class="cvmic-txt">说话</span>
          </button>
        </div>
      </div>
    </div>`;
  m.classList.add('show');
  m.classList.add('convmode');

  const logEl = $('#cvLog', m), faceEl = $('#cvFace', m), ta = $('#cvTa', m), tip = $('#cvTip', m);
  const viTxt = $('.vi-txt', m), zhTxt = $('.zh-txt', m);
  if (cvF === 'th') { viTxt.classList.add('thtxt'); viTxt.lang = 'th'; }
  viTxt.style.color = 'var(--' + cvF + ')';  // 旧版写死 --vi，泰/英方向语种色不一致

  const tagText = {
    fixed: '场景库固定语句',
    lib:   '场景库词条（机翻初稿）',
    phrase:'固定译法（人工核过）',
    mt:    '机翻初稿 · 关键用语请确认'
  };
  const setMode = (v, save) => {
    mode = v === 'face' ? 'face' : 'bubble';
    logEl.hidden = (mode === 'face');
    faceEl.hidden = (mode !== 'face');
    $$('.conv-modes button', m).forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
    if (save) { try { localStorage.setItem('hy_conv_mode', mode); } catch (e) {} }
    tip.textContent = mode === 'face'
      ? '对面屏：把手机转过去，对方读上半屏的倒置大字；也可点「朗读」。'
      : '气泡按说话方分色：浅棕=你、灰绿=对方；语种色只做竖条。';
  };
  const setWho = v => {
    speakerLang = v;
    $('#cvWhoMe', m).classList.toggle('on', v === 'zh');
    $('#cvWhoThem', m).classList.toggle('on', v !== 'zh');
  };
  const paint = () => {
    if (!log.length) {
      logEl.innerHTML = '<div class="cv-empty">还没有对话。<br>点下方圆形按钮说一句，或打字后点「翻译并显示」。<br>「对面屏」可切回给对面人看的倒置大字。</div>';
      zhTxt.textContent = ''; viTxt.textContent = '';
    } else {
      logEl.innerHTML = log.map((e, i) => {
        const isMe = e.who === 'me';
        const bar = isMe ? 'var(--' + cvF + ')' : 'var(--brand)';
        const outLang = isMe ? cvF : 'zh';
        const srcTh = detectLang(e.src) === 'th' ? ' thtxt' : '';
        return '<div class="cbub ' + (isMe ? 'me' : 'them') + '">' +
          '<div class="cbub-bar" style="background:' + bar + '"></div>' +
          '<div class="cbub-who">' + (isMe ? '我 · 中文' : '对方 · ' + fName) + '</div>' +
          '<div class="cbub-src' + srcTh + '"' + (srcTh ? ' lang="th"' : '') + '>' + escHtml(e.src) + '</div>' +
          '<div class="cbub-out' + (outLang === 'th' ? ' thtxt' : '') + '"' + (outLang === 'th' ? ' lang="th"' : '') + '>' + escHtml(e.out) + '</div>' +
          '<div class="cbub-foot"><span class="cbub-tag ' + e.kind + '">' + (tagText[e.kind] || tagText.mt) + '</span>' +
          '<button type="button" class="cbub-play" data-i="' + i + '">朗读</button></div>' +
        '</div>';
      }).join('');
      const last = log[log.length - 1];
      zhTxt.textContent = last.zh; viTxt.textContent = last.vi;
    }
    logEl.scrollTop = logEl.scrollHeight;
  };
  const push = e => {
    log.push(e);
    if (log.length > 30) log.shift();
    paint();
    pushHist(e.zh, e.vi, cvF);
  };
  const run = () => {
    const src = ta.value.trim();
    if (!src) { tip.textContent = '先说一句，或打字'; return; }
    // 对方说英语时 detectLang 返回 'latin'（不是 'en'），旧版用 detectLang(src)===cvF 判方向会误判；
    // 现统一按「是否中文」判定说话方，方向随之确定，四语种都成立。
    const isMe = detectLang(src) === 'zh';
    const dir = isMe ? 'zh2' + cvF : cvF + '2zh';
    const done = (out, kind) => {
      const zh = isMe ? src : out, vi = isMe ? out : src;
      push({ who: isMe ? 'me' : 'them', src: src, out: out, zh: zh, vi: vi, kind: kind });
      ta.value = '';
      tip.textContent = (mode === 'face' ? '已显示在对面屏，把手机转过去给对方看。' : '已加入对话。')
        + (kind === 'mt' ? '机翻初稿，关键用语请确认。' : '命中固定译法，未走机翻。');
    };
    const fix = isMe ? phraseFix(src, dir) : '';
    if (fix) { done(fix, 'phrase'); return; }
    const lib = isMe ? convLib(src, cvF) : { out:'', kind:'' };
    if (lib.out) { done(lib.out, lib.kind); return; }
    tip.textContent = '翻译中…（需联网）';
    translate(src, dir).then(out => done(out, 'mt'))
      .catch(e => { tip.textContent = '翻译失败：' + (e && e.message ? e.message : '网络不通') + '。可改用场景库固定语句。'; });
  };

  $$('.conv-modes button', m).forEach(b => { b.onclick = () => setMode(b.dataset.mode, true); });
  $('#cvWhoMe', m).onclick = () => setWho('zh');
  $('#cvWhoThem', m).onclick = () => setWho(cvF);
  const micState = $('#cvMicState', m), micBig = $('#cvMicBig', m), micLabel = $('.cvmic-txt', m);
  micState.textContent = '麦克风待命';  // paintMicBtn 依赖非空初值还原文字，显式设一次不依赖模板解析
  // paintMicBtn 只改传入元素的 class，这里把状态同步到圆形大按钮（文字改「停止」+ 外圈脉冲）
  const micObs = window.MutationObserver ? new window.MutationObserver(() => {
    const live = micState.classList.contains('mic-live');
    micBig.classList.toggle('on', live);
    micLabel.textContent = live ? '停止' : '说话';
  }) : { observe(){}, disconnect(){} };
  micObs.observe(micState, { attributes:true, attributeFilter:['class'] });
  micBig.onclick = () => startDictation(ta, () => { if (ta.value.trim()) run(); }, speakerLang, micState);
  $('#cvGo', m).onclick = run;
  $('#cvClear', m).onclick = () => { log.length = 0; paint(); tip.textContent = '对话已清空（历史页记录不受影响）'; };
  $('#cvClose', m).onclick = () => { micObs.disconnect(); m.classList.remove('show'); m.classList.remove('convmode'); };
  $('#cvPlayVi', m).onclick = () => { if (log.length) speak(log[log.length - 1].vi, cvF); else tip.textContent = '先翻译出' + fName; };
  $('#cvPlayViSlow', m).onclick = () => { if (log.length) speak(log[log.length - 1].vi, cvF, true); else tip.textContent = '先翻译出' + fName; };
  logEl.addEventListener('click', ev => {
    const b = ev.target.closest ? ev.target.closest('.cbub-play') : null;
    if (!b) return;
    const e = log[Number(b.dataset.i)];
    if (e) speak(e.out, e.who === 'me' ? cvF : 'zh');
  });
  ta.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); run(); } });
  setMode(mode, false);
  setWho('zh');
  paint();
}

let lastSrc = '', lastOut = '', lastDir = '';
function doTranslate(resBox, quiet) {
  const src = $('#srcTa', document).value.trim();
  const dir = state.dir;
  if (!src) { if (!quiet) toast('请先输入内容'); return; }
  if (dir === lastDir && src === lastSrc && lastOut) { paintRes(src, lastOut, dir, resBox); return; }
  if (src.length > 480) { toast('一次别超过 480 字，请分段'); return; }
  resBox.innerHTML = '<div class="tip">翻译中…（需联网）</div>';
  translate(src, dir).then(txt => {
    lastSrc = src; lastOut = txt; lastDir = dir;
    paintRes(src, txt, dir, resBox);
    const _f = dirFrom(dir), _t = dirTo(dir);
    const _toZh = _t === 'zh';
    const _zh = _toZh ? txt : src;
    const _tgt = _toZh ? src : txt;
    const _lang = _toZh ? _f : _t;
    pushHist(_zh, _tgt, _lang);
  }).catch(err => {
    resBox.innerHTML = '';
    const d = document.createElement('div');
    d.className = 'tip err';
    d.textContent = '翻译失败：' + (err && err.message ? err.message : '网络不通') + '。请确认手机已联网，或改用场景库固定语句。';
    resBox.appendChild(d);
  });
}

  '请多关照':           { vi:'Xin giúp đỡ tôi',      en:'Please treat me kindly', th:'ยินดีที่ได้รู้จักนะ' },
  '谢谢':               { vi:'Cảm ơn bạn',           en:'Thank you',              th:'ขอบคุณครับ' }

  const fixed = phraseFix(text, dir);

  const key = 'tr:' + dir + ':' + text;
  const cached = trCacheGet(key);
  if (cached) return Promise.resolve(cached);
  const useBaidu = (BAIDU_PROXY_URL && BAIDU_PROXY_URL.trim()) || (BAIDU_APPID && BAIDU_KEY);
  if (!useBaidu) {
    return mymemoryTranslate(text, dir).then(out => { trCachePut(key, out); return out; });
  }
  const baiduPromise = (BAIDU_PROXY_URL && BAIDU_PROXY_URL.trim())
    ? baiduViaProxy(text, dir, BAIDU_PROXY_URL.trim())
    : baiduTranslate(text, dir);
  return baiduPromise
    .then(out => { trCachePut(key, out); return out; })
    .catch(() => mymemoryTranslate(text, dir).then(out => { trCachePut(key, out); return out; }));

function mymemoryTranslate(text, dir) {
  const c = pairCodes(dir);
  const lp = c.mf + '|' + c.mt;
  const url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text) + '&langpair=' + encodeURIComponent(lp);
  return new Promise((resolve, reject) => {
    const ctrl = ('AbortController' in window) ? new AbortController() : null;
    if (ctrl) setTimeout(() => ctrl.abort(), 12000);
    fetch(url, ctrl ? { signal: ctrl.signal } : undefined)
      .then(r => { if (!r.ok) throw new Error('接口返回 ' + r.status); return r.json(); })
      .then(j => {

            (to === 'th' && !/[\u0e00-\u0e7f]/.test(out))) {

/* 按钮的「聆听中」可视状态 */
function paintMicBtn(btn, on, label) {
  if (!btn) return;
  if (on) {
    if (!btn.dataset.orig) btn.dataset.orig = btn.textContent;
    btn.classList.add('mic-live');

/* 申请麦克风（返回 stream，供电平条使用；同时把「被拒绝/无设备」提前暴露） */
function getUserMic() {
  return new Promise((resolve, reject) => {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      reject(Object.assign(new Error('浏览器不支持录音接口'), { name: 'NotSupported' }));
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(resolve).catch(reject);
  });
}

/* 实时麦克风电平：说话时条子会跳，用来证明「到底有没有收到声音」 */
let micStream = null, audioCtx = null, meterRAF = 0, meterEl = null;
function meterStart(stream) {
  micStream = stream;
  // 对话模式是整屏递给对方看的界面，底部浮层会挡住内容，只用红色脉冲按钮提示即可
  const mask = document.querySelector('#mask');
  if (mask && mask.classList.contains('convmode')) return;
  if (!meterEl) {
    meterEl = document.createElement('div');
    meterEl.id = 'micMeter';
    meterEl.innerHTML = '<div class="lbl">麦克风电平（说话时应在跳动）</div><div class="track"><div id="micBar"></div></div>';
    document.body.appendChild(meterEl);
  }
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaStreamSource(stream);
    const ana = audioCtx.createAnalyser();
    ana.fftSize = 512;
    src.connect(ana);
    const buf = new Uint8Array(ana.fftSize);
    const bar = meterEl.querySelector('#micBar');
    const tick = () => {
      ana.getByteTimeDomainData(buf);
      let sum = 0;
      for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; sum += v * v; }
      const pct = Math.min(100, Math.round(Math.sqrt(sum / buf.length) * 300));
      bar.style.width = pct + '%';
      bar.classList.toggle('hot', pct > 55);
      meterRAF = requestAnimationFrame(tick);
    };
    tick();
  } catch (e) { /* 不支持 Web Audio 就只保留按钮状态 */ }
}

  if (meterRAF) { cancelAnimationFrame(meterRAF); meterRAF = 0; }

  if (meterEl) { meterEl.remove(); meterEl = null; }
}

  listening = false;

    const sc = simVi(n, e.n);
    if (sc > best.score) best = { match: e.raw, score: sc };
  }
  return best;
}

// 从多个候选里挑「词库最贴近」的；返回 {text, canonical, score}
function pickBestVi(alts) {
  let best = { text: alts[0] || '', canonical: null, score: 0 };
  for (const a of alts) {
    if (!a) continue;
    const sc = bestViMatch(a);
    if (sc.score > best.score) best = { text: a, canonical: sc.match, score: sc.score };
  }
  return best;
}


/* ---------- V1.6.0 泰语识别纠错 ----------
   泰文无词间空格、声调符为独立组合字符，不能套用 normVi 的 NFD 去调逻辑；
   这里只做空白归一，相似度复用通用的编辑距离 simVi（阈值在调用处统一判断）。 */
function normTh(s) { return (s || '').replace(/\s+/g, ' ').trim(); }
let _thIndex = null;
function ensureThIndex() {
  if (_thIndex) return _thIndex;
  _thIndex = [];
  const add = r => { r = (r || '').trim(); if (r && !_thIndex.some(x => x.raw === r)) _thIndex.push({ raw: r, n: normTh(r) }); };
  [SC_A, SC_B, SC_C, SC_D].forEach(arr => (arr || []).forEach(it => add(it[4])));
  if (SENT4 && SENT4.items) SENT4.items.forEach(it => add(it[4]));
  if (typeof VOCAB !== 'undefined') (VOCAB || []).forEach(g => (g.items || []).forEach(it => add(it[4])));
  if (typeof MONEY !== 'undefined') (MONEY || []).forEach(it => add(it[5]));
  return _thIndex;
}
function pickBestTh(alts) {
  const idx = ensureThIndex();
  let best = { text: alts[0] || '', canonical: null, score: 0 };
  for (const a of alts) {
    if (!a) continue;
    const n = normTh(a);
    for (const e of idx) {
      const sc = simVi(n, e.n);
      if (sc > best.score) best = { text: a, canonical: e.raw, score: sc };
    }
  }
  return best;
}

async function startDictation(ta, onDone, lang, btn) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  // 再点一次 = 停止（「正在启动」与「聆听中」都算）
  if (micBusy) {
    const stopper = activeStop;
    activeStop = null;
    micBusy = false;
    if (stopper) { try { stopper(); } catch (e) {} }
    else { stopListening(); }
    paintMicBtn(btn, false);
    meterStop();
    toast('已停止');
    if (onDone) { try { onDone(ta.value); } catch (e) {} }
    return;
  }

  // ① 本地文件被浏览器禁麦克风（最常见的「点了没反应」）
  if (location.protocol === 'file:') {
    toast('本地文件（file://）里麦克风被禁用，请用 https 网址打开');
    showMicGuide('当前是本地文件 file://，浏览器禁止麦克风');
    return;
  }
  // ② 非安全源（纯 http 局域网）也会被禁
  if (!window.isSecureContext && location.hostname !== 'localhost') {
    toast('当前不是 https，浏览器禁止麦克风。请改用输入法语音键');
    showMicGuide('当前地址不是 https');
    return;
  }

  // 【决策顺序】非 iOS 时：越南语/中文 优先走云端 Whisper（高精度，需配 WHISPER_PROXY）；
  //             中文且配了百度 → 走百度；否则走浏览器内置识别（越南语已加本应用词库纠错）。
  const reqLang = lang || dirToLang(state.dir);
  if (!isIOS()) {
    if (whisperASRAvailable()) return whisperASRDictate(ta, onDone, btn, reqLang);
    if (reqLang === 'zh' && baiduASRAvailable()) return baiduASRDictate(ta, onDone, btn);
  }

  // 其余情况（iOS / 未配云端）→ 走浏览器内置语音识别
  if (!SR) { showMicGuide('你的浏览器不支持内置语音识别'); return; }

  const myToken = ++micToken;
  micBusy = true;
  const alive = () => myToken === micToken;
  // 立即给出反馈，避免「点了没动静」
  paintMicBtn(btn, true, '正在启动麦克风…');

  const fail = msg => {
    micBusy = false; micToken++;
    paintMicBtn(btn, false);
    meterStop();
    toast(msg);
  };

  // ③ 非 iOS：先申请权限并打开电平条，把「拒绝/无设备」提前暴露。iOS Safari 必须保留用户手势，故跳过预检
  if (!isIOS()) {
    try {
      const stream = await getUserMic();
      if (!alive()) { try { stream.getTracks().forEach(t => t.stop()); } catch (e) {} return; }
      meterStart(stream);
    } catch (e) {
      const n = e && e.name;
      if (n === 'NotAllowedError' || n === 'SecurityError') { fail('麦克风权限被拒绝：点地址栏右侧锁图标→允许麦克风，再试'); return; }
      if (n === 'NotFoundError' || n === 'DevicesNotFoundError') { fail('没有检测到麦克风设备，请接上耳麦或检查系统录音设备'); return; }
      if (n === 'NotReadableError') { fail('麦克风被其他程序占用，关掉后重试'); return; }
      fail('无法开启麦克风：' + (e && e.message ? e.message : '未知错误'));
      return;
    }
  }
  if (!alive()) return;

  const useLang = lang || dirToLang(state.dir);
  try {
    recog = new SR();
    recog.lang = LANGS[useLang] ? LANGS[useLang].tts : 'zh-CN';
    recog.interimResults = true;
    recog.continuous = false;
    recog.maxAlternatives = 5; // 多候选：让纠错引擎从多个结果里挑最贴近词库的一条
    activeStop = () => { try { recog.onend = null; recog.stop(); } catch (e) {} };
  } catch (e) { micBusy = false; paintMicBtn(btn, false); meterStop(); showMicGuide('初始化语音识别失败'); return; }

  const old = ta.value.trim();
  let gotAny = false;
  let gotText = false;
  const startTimer = setTimeout(() => {
    if (!listening && alive()) {
      micBusy = false;
      toast('麦克风没有启动，可能被系统拦截');
      stopListening();
      paintMicBtn(btn, false);
    }
  }, 5000);
  let silenceTimer = null;

  recog.onstart = () => {
    if (!alive()) return;
    listening = true;
    clearTimeout(startTimer);
    paintMicBtn(btn, true, '请说' + (LANGS[useLang] ? LANGS[useLang].name : '中文') + '…点击停止');
    silenceTimer = setTimeout(() => {
      if (!gotAny && alive()) {
        micBusy = false;
        toast('没听到声音，请靠近麦克风再说一次');
        stopListening();
        paintMicBtn(btn, false);
      }
    }, 12000);
  };

  recog.onresult = ev => {
    if (!alive()) return;
    gotAny = true;
    clearTimeout(silenceTimer);

    // 收集最终结果的多个候选（maxAlternatives 已设为 5）
    const finals = [];
    for (let i = 0; i < ev.results.length; i++) {
      const rs = ev.results[i];
      if (rs && rs.isFinal) {
        for (let a = 0; a < rs.length; a++) {
          if (rs[a] && typeof rs[a].transcript === 'string' && rs[a].transcript.trim()) finals.push(rs[a].transcript.trim());
        }
      }
    }

    // 还没有最终结果：先显示临时识别文本（实时反馈）
    if (!finals.length) {
      let s = '';
      for (let i = 0; i < ev.results.length; i++) {
        const rs = ev.results[i];
        if (!rs) continue;
        const alt = (rs[0] !== undefined && rs[0] !== null) ? rs[0] : rs;
        const t = (alt && typeof alt.transcript === 'string') ? alt.transcript : '';
        if (t) s += t;
      }
      s = s.replace(/\bundefined\b/gi, ' ').replace(/\bnull\b/gi, ' ').replace(/\s+/g, ' ').trim();
      if (s) ta.value = (old ? old + ' ' : '') + s;
      return;
    }

    // 最终结果：越南语/泰语用应用词库从多候选里挑最贴近的一条并自动校正。
    // 只有相似度 >= 0.75 才替换，避免与词库完全无关的句子被误改成别的句子。
    let finalText = finals[0];
    if (useLang === 'vi' || useLang === 'th') {
      const isTh = useLang === 'th';
      const best = isTh ? pickBestTh(finals) : pickBestVi(finals);
      const norm = isTh ? normTh : normVi;
      if (best.score >= 0.75 && best.canonical) {
        finalText = best.canonical;
        if (best.text && norm(best.text) !== norm(best.canonical)) toast('已按词库校正：' + best.canonical);
      } else {
        finalText = best.text || finals[0];
      }
    }
    ta.value = (old ? old + ' ' : '') + finalText;
    gotText = true;
  };

  recog.onerror = ev => {
    listening = false; micBusy = false;
    clearTimeout(startTimer); clearTimeout(silenceTimer);
    paintMicBtn(btn, false);
    meterStop();
    const err = ev && ev.error;
    if (err === 'aborted') return;
    if (err === 'not-allowed' || err === 'service-not-allowed') {
      toast('麦克风权限被拒绝：点地址栏锁图标→允许麦克风');
    } else if (err === 'no-speech') {
      toast('没听清，请再说一次');
    } else if (err === 'audio-capture') {
      toast('没有可用的麦克风');
    } else if (err === 'network') {
      toast('浏览器语音服务连不上（国内 Chrome 常被墙），改用输入法语音键');
      showMicGuide('语音识别服务器连不上');
    } else if (err === 'language-not-supported') {
      toast('该浏览器不支持此语言，请改用输入法语音键');
    } else {
      toast('识别失败（' + err + '），可改用输入法语音键');
    }
  };

  recog.onend = () => {
    listening = false; micBusy = false;
    clearTimeout(startTimer); clearTimeout(silenceTimer);
    paintMicBtn(btn, false);
    meterStop();
    // 有声音事件但一个字都没拿到 → 说明浏览器把音频发给了境外服务器却没回来结果
    if (!gotText && ta.value.trim() === old) toast('没识别出文字：国内 Chrome 的语音服务常连不上境外服务器，建议配百度识别或改用输入法语音键');
    if (onDone) { try { onDone(ta.value); } catch (e) {} }
  };

  try { recog.start(); }
  catch (e) {
    listening = false; micBusy = false; clearTimeout(startTimer);
    paintMicBtn(btn, false);
    meterStop();
    showMicGuide('启动语音识别失败');
  }
}

/* 语音指引：从对话模式弹出时用内嵌浮层，不能覆盖 #mask 里的会话（V1.7.0 修复） */
function showMicGuide(reason) {
  const m = $('#mask');
  const inConv = m.classList.contains('convmode');
  const why = (typeof reason === 'string' && reason)
    ? '<p class="tip">原因：' + reason + '</p>' : '';
  const fileTip = (location.protocol === 'file:')
    ? '<p><b>你现在是双击本地文件打开的（file://），浏览器在本地文件里禁止麦克风。</b>请把网站部署成 https 网址后再试，或直接用输入法语音键。</p>'
    : '';
  const prev = inConv ? m.querySelector('.cv-guide') : null;
  if (prev) prev.remove();
  const host = inConv ? document.createElement('div') : m;
  if (inConv) { host.classList.add('cv-guide'); m.appendChild(host); m.onclick = null; }
  host.innerHTML =
    '<div class="modal">' +
    '<h3>语音输入怎么用最稳</h3>' +
    why + fileTip +
    '<p><b>最稳的做法：用手机输入法的语音键。</b>你在中文输入法点麦克风说中文，越南同事用 Gboard/越南语键盘说越南语，转成文字后再点翻译。这条路 100% 可用，不受浏览器限制。</p>' +
    '<p>内置麦克风按钮走浏览器语音识别：<b>Edge、iOS Safari、海外网络下的 Chrome 一般可用；国内 Chrome 常连不上语音服务器</b>。若点了没反应或报「连不上服务器」，就换上面输入法的路子。</p>' +
    '<p class="tip"><b>越南语已做词库纠错：</b>识别结果会自动和应用自带近 500 条正确越南语（场景/百句/词库/金额）比对、挑最贴近的一条，行业词汇误识大幅减少（识别框上方会提示「已按词库校正」）。</p>' +
    '<p class="tip">若仍不够准，可在部署时配置 <b>OpenAI Whisper 云端识别</b>（在 index.html 填 WHISPER_PROXY、服务端设 OPENAI_APIKEY），越南语/中文准确度会再上一个台阶；不改则默认走上面的词库纠错方案。</p>' +
    '<p class="tip">越南文你打不出来很正常：需要「越→中」时，直接把手机递给越南同事，让对方语音或键盘输入。</p>' +
    '<button type="button" class="primary" id="mClose">知道了</button>' +
    '</div>';
  m.classList.add('show');
  const close = () => { if (inConv) host.remove(); else m.classList.remove('show'); };
  $('#mClose', host).onclick = close;
  host.onclick = e => { if (e.target === host) close(); };
}

/* 音频 blob → 16k 单声道 WAV → 调代理 → 返回识别文字 */
async function transcribeBaidu(blob) {
  const buf = await blob.arrayBuffer();
  const AC = window.AudioContext || window.webkitAudioContext;
  const ac = new AC();
  let decoded;
  try { decoded = await ac.decodeAudioData(buf); }
  finally { try { ac.close(); } catch (e) {} }
  const mono = toMono(decoded);
  const resampled = await resampleTo(mono, 16000);
  const wav = encodeWAV(resampled, 16000);
  const b64 = b64FromBuffer(wav);
  const r = await fetch(BAIDU_ASR_PROXY.trim(), {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ audio: b64, len: wav.byteLength })
  });
  const j = await r.json();
  if (j && j.err) throw new Error(j.err);
  return (j && j.text) ? j.text : '';
}

function toMono(audioBuffer) {

    '语种要与照片里的文字一致：拍英文却选中文会出乱码。识别完务必人工改字再对外沟通。</p>' +
    '<p>「自动识别翻译」默认开：选图即自动识别、识别完自动翻成其余三语种，和微信扫一扫翻译一致；关掉则手动点两次。</p>' +
    '<p>腾讯云开通后（每月 1000 次免费）在 Cloudflare Pages 的 Settings 里设环境变量 <code>TENCENT_OCR_SECRET_ID</code> 与 <code>TENCENT_OCR_SECRET_KEY</code>，下次自动启用云端，无需改代码。</p></details>' +
    '<div class="pt-pick">' +
    '<button type="button" id="ptCamBtn">拍照</button>' +
    '<button type="button" id="ptLibBtn">从相册选</button>' +
    '<button type="button" id="ptEnhBtn" class="on">图像增强：开</button>' +
    '<button type="button" id="ptAutoBtn" class="on">自动识别翻译：开</button>' +
    '<input type="file" id="ptCam" accept="image/*" capture="environment">' +
    '<input type="file" id="ptLib" accept="image/*">' +
    '</div>' +
    '<div class="pt-shot" id="ptShot">' +
    '<img class="pt-img" id="ptImg" alt="待识别图片" hidden>' +
    '<span class="pt-badge pt-meta" id="ptMeta">尚未选择图片</span>' +
    '<span class="pt-badge pt-zoom">点图放大</span></div>' +
    '<div class="pt-lbl"><b>图片里是什么文字？</b><span>与翻译原文语种联动</span></div>' +
    '<div class="pt-langs" id="ptLangs">' + PT_LANGS.map(function (o) {
      return '<button type="button" data-k="' + o.k + '"' + (o.k === _ptLang ? ' class="on"' : '') + '>' + o.name + '</button>';
    }).join('') + '</div>' +
    '<div class="pt-act"><button type="button" class="primary" id="ptOcr">开始识别</button>' +
    '<button type="button" id="ptRedo" hidden>换语种重识别</button></div>' +
    '<div class="pt-prog"><i id="ptBar"></i></div>' +
    '<div class="pt-status" id="ptStatus">尚未选择图片。</div>' +
    '<div class="pt-eng" id="ptEng" style="font-size:11.5px;color:var(--sub);margin:2px 0 0;min-height:15px"></div>' +
    '<div class="pt-warn" id="ptWarn"></div>' +
    '<div class="pt-lbl"><b>识别文字（务必人工校对）</b><span id="ptCount">0 字</span></div>' +
    '<textarea class="pt-text" id="ptText" placeholder="识别结果会出现在这里，也可以直接粘贴文字"></textarea>' +
    '<div class="pt-text-acts"><button type="button" id="ptClear">清空</button>' +
    '<button type="button" id="ptSel">全选</button></div>' +
    '<div class="pt-act"><button type="button" class="primary" id="ptGo">翻译成其余三语种</button></div>' +
    '<div class="pt-result" id="ptResult"></div>' +
    '</div>';
  document.body.appendChild(m);

  function setStatus(t) { var el = $('#ptStatus', m); if (el) el.textContent = t; }
  function setBar(n) { var el = $('#ptBar', m); if (el) el.style.width = Math.max(0, Math.min(100, n)) + '%'; }
  function count() {
    var el = $('#ptCount', m);
    if (el) el.textContent = ($('#ptText', m).value || '').length + ' 字';
  }
  function warn(msg) {
    var w = $('#ptWarn', m);
    if (w) { w.textContent = msg || ''; w.classList.toggle('on', !!msg); }
    var rb = $('#ptRedo', m); if (rb) rb.hidden = !(msg && _ptFile);
  }
  function close() {
    m.remove();
    if (_ptUrl) { try { URL.revokeObjectURL(_ptUrl); } catch (e) {} _ptUrl = null; }
  }
  $('#ptClose', m).onclick = close;
  m.onclick = function (e) { if (e.target === m) close(); };

  $('#ptShot', m).onclick = function () { if (_ptUrl) ptZoom(_ptUrl); };
  $('#ptEnhBtn', m).onclick = function () {
    _ptEnhance = !_ptEnhance;
    this.textContent = '图像增强：' + (_ptEnhance ? '开' : '关');
    this.classList.toggle('on', _ptEnhance);
    setStatus(_ptEnhance ? '图像增强已开启，识别时会做灰度与对比度处理。' : '图像增强已关闭，将按原图识别。');
  };
  $('#ptAutoBtn', m).onclick = function () {
    _ptAuto = !_ptAuto;
    this.textContent = '自动识别翻译：' + (_ptAuto ? '开' : '关');
    this.classList.toggle('on', _ptAuto);
    try { localStorage.setItem('vn_ptAuto', _ptAuto ? '1' : '0'); } catch (e) {}
    setStatus(_ptAuto ? '自动识别翻译已开启：选图即识别，识别完自动翻译。' : '自动识别翻译已关闭：需手动点「开始识别」和「翻译」。');
  };
  (function () {   // 打开时把按钮同步成真实的 _ptAuto（含用户上次的选择）
    var b = $('#ptAutoBtn', m);
    b.textContent = '自动识别翻译：' + (_ptAuto ? '开' : '关');
    b.classList.toggle('on', _ptAuto);
  })();

  [].forEach.call($('#ptLangs', m).querySelectorAll('button'), function (b) {
    b.onclick = function () {
      _ptLang = b.getAttribute('data-k') || 'zh';
      [].forEach.call($('#ptLangs', m).querySelectorAll('button'), function (x) {
        x.classList.toggle('on', x === b);
      });
      warn('');
      setStatus('已选「' + ptNameOf(_ptLang) + '」。点「开始识别」；若已识别过，可点「换语种重识别」。');
    };
  });

  function pick(f) {
    if (!f) return;
    _ptFile = f;
    if (_ptUrl) { try { URL.revokeObjectURL(_ptUrl); } catch (e) {} }
    _ptUrl = URL.createObjectURL(f);
    var im = $('#ptImg', m);
    im.onload = function () {
      var meta = $('#ptMeta', m);
      if (meta) meta.textContent = (im.naturalWidth || 0) + ' × ' + (im.naturalHeight || 0);
    };
    im.hidden = false;
    im.src = _ptUrl;
    $('#ptText', m).value = ''; $('#ptResult', m).innerHTML = '';
    count(); setBar(0); warn(''); _ptLastConf = null; _ptEngine = '';
    setStatus(_ptAuto ? '已选图片，自动识别中（先云端，失败回退本地）…' :
      '已选图片。请确认上面「图片里是什么文字」选对了，再点「开始识别」。');
    if (_ptAuto) { setTimeout(runOcr, 60); }
  }
  $('#ptCamBtn', m).onclick = function () { $('#ptCam', m).click(); };
  $('#ptLibBtn', m).onclick = function () { $('#ptLib', m).click(); };
  ['ptCam', 'ptLib'].forEach(function (id) {
    $('#' + id, m).onchange = function (e) { pick(e.target.files && e.target.files[0]); };
  });
  $('#ptClear', m).onclick = function () { $('#ptText', m).value = ''; count(); };
  $('#ptSel', m).onclick = function () { var t = $('#ptText', m); if (t.select) t.select(); };
  $('#ptText', m).oninput = count;

  /* 识别结果统一处理：写文本框 + 置信度/语种告警 + 引擎标注 + 自动翻译 */
  function onResult(txt, conf, engine) {
    _ptLastConf = conf; _ptEngine = engine || '';
    $('#ptText', m).value = txt;
    count(); setBar(100);
    var msg = ptMismatch(txt, _ptLang, conf);
    warn(msg);
    var engTxt = _ptEngine === 'tencent' ? '腾讯云OCR' : '本地识别';
    var engEl = $('#ptEng', m);   // 持久标注：引擎 + 可信度，不因「正在翻译」被覆盖
    if (engEl) engEl.textContent = '识别引擎：' + engTxt +
      (conf === null ? '' : ' · 可信度 ' + Math.round(conf) + '%') + '（机翻初稿，关键用语请人工确认）';
    var tail = (conf === null ? '' : ' · 可信度 ' + Math.round(conf) + '%') + ' · 引擎 ' + engTxt;
    setStatus(msg ? '识别完成，但结果需要复核（见上方提示）。' + tail :
      '识别完成，请核对文字后再翻译。' + tail);
    if (_ptAuto) doTranslate();
  }
  /* 本地识别（Tesseract）：云端未配置/失败时的兜底 */
  function localOcr(cv) {
    var ocr = ptOcrOf(_ptLang);
    setStatus('正在本地识别（' + ptNameOf(_ptLang) + '）…');
    var statusMap = {
      'loading tesseract core': '加载识别核心…',
      'initializing tesseract': '初始化识别引擎…',
      'loading language traineddata': '下载语种识别包（首次较慢）…',
      'initializing api': '准备识别…',
      'recognizing text': '正在识别文字…'
    };
    function logger(p) {
      if (!p || !p.status) return;
      if (p.status === 'recognizing text') setBar(Math.round((p.progress || 0) * 100));
      setStatus(statusMap[p.status] || p.status);
    }
    return ptLoadEngine().then(function (T) {
      return ptWorker(T, ocr, logger).then(function (w) { return w.recognize(cv); });
    }).then(function (r) {
      var data = (r && r.data) || {};
      onResult((data.text || '').replace(/\n{3,}/g, '\n\n').trim(),
        (typeof data.confidence === 'number') ? data.confidence : null, 'local');
    });
  }
  function runOcr() {
    if (_ptBusy) return;
    if (!_ptFile) { toast('请先拍照或从相册选一张图片'); return; }
    _ptBusy = true;
    [$('#ptOcr', m), $('#ptRedo', m)].forEach(function (b) { if (b) b.disabled = true; });
    setBar(0); warn('');
    setStatus('正在准备图片…');
    ptPrepare(_ptFile, _ptEnhance).then(function (cv) {
      var b64 = '';
      try { b64 = (cv.toDataURL ? cv.toDataURL('image/jpeg', 0.82) : '').split(',')[1] || ''; } catch (e) { b64 = ''; }
      if (b64 && b64.length < 7 * 1024 * 1024) {
        setStatus('正在云端识别（腾讯云 OCR）…');
        return ptCloudOCR(b64).then(function (r) {
          if (r) { onResult(r.text, r.confidence, 'tencent'); return null; }
          setStatus('未配置云识别密钥，改用本地识别…');
          return localOcr(cv);
        }).catch(function () {
          setStatus('云端识别失败，改用本地识别…');
          return localOcr(cv);
        });
      }
      setStatus('改用本地识别…');
      return localOcr(cv);
    }).catch(function (e) {
      setStatus('识别失败：' + (e && e.message ? e.message : '未知错误') +
        '。可检查网络后重试，或直接在下方粘贴文字翻译。');
    }).then(function () {
      _ptBusy = false;
      [$('#ptOcr', m), $('#ptRedo', m)].forEach(function (b) { if (b) b.disabled = false; });
    });
  }
  $('#ptOcr', m).onclick = runOcr;
  $('#ptRedo', m).onclick = runOcr;

  function doTranslate() {
    var text = $('#ptText', m).value.trim();
    if (!text) { toast('请先识别或粘贴文字'); return; }
    var srcK = ptSrcKey(text, _ptLang);
    var box = $('#ptResult', m);
    box.innerHTML = '';
    box.appendChild(ptCard(LANGS[srcK].name + ' · 原文（识别结果，请核对）', text, srcK, false).el);
    setStatus('正在翻译，机翻结果请人工确认关键用语…');
    LANG_KEYS.filter(function (k) { return k !== srcK; }).forEach(function (t) {
      var card = ptCard(LANGS[t].name, '翻译中…', t, true);
      box.appendChild(card.el);
      translate(text, srcK + '2' + t).then(function (out) {
        card.p.textContent = out || '—';
      }).catch(function () {
        card.p.textContent = '该语种翻译失败，请检查网络后重试。';
      });
    });
    if (box.scrollIntoView) box.scrollIntoView({ behavior:'smooth', block:'nearest' });
  }
  $('#ptGo', m).onclick = doTranslate;
}

/* ---------- 收藏 tab ---------- */
function renderFavView(host) {
  const box = document.createElement('div');
  box.className = 'listbox';
  host.appendChild(box);
  const h = document.createElement('div');
  h.className = 'sec-title';
  h.textContent = '我的收藏 · ' + state.fav.length + ' 句';
  box.appendChild(h);
  if (!state.fav.length) {
    const t = document.createElement('div');
    t.className = 'tip';
    t.textContent = '还没有收藏。在场景卡片或翻译结果里点「收藏」，常用句会固定在这里，出差现场直接翻到这一页就能用。';
    box.appendChild(t);
  }
  state.fav.forEach(it => box.appendChild(phraseCard(it[0], it[1], it[2], it[3] || 'vi', it[4], it[5])));
  const tip = document.createElement('div');
  tip.className = 'tip';
  tip.textContent = '提示：收藏存在本机浏览器里。换手机或换浏览器不会带过去；清理浏览器数据会丢失。';
  box.appendChild(tip);
}

/* ---------- 主渲染 ---------- */
function syncGlobalInput() {
  const g = $('#qGlobal');
  if (g && g.value !== state.q) g.value = state.q;
  const c = $('#qClr');
  if (c) c.classList.toggle('on', !!state.q);
}

function onGlobalSearch() {
  const g = $('#qGlobal');
  const v = g ? g.value.trim() : '';
  state.q = v;
  const c = $('#qClr');
  if (c) c.classList.toggle('on', !!v);
  if (!v) {
    if (state.tab === 'search') state.tab = 'scene';
    renderTab();
    return;
  }
  /* 在场景详情里输入 = 场景内筛选；其余情况跳全局搜索 */
  if (state.tab === 'scene' && state.sceneOpen) { renderTab(); return; }
  state.tab = 'search';
  renderTab();
}

function renderTab() {
  const main = $('#main');
  main.innerHTML = '';
  const view = document.createElement('div');
  view.className = 'view';
  main.appendChild(view);
  if (state.tab === 'scene') renderSceneView(view);
  else if (state.tab === 'vocab') renderVocabView(view);
  else if (state.tab === 'search') renderSearchView(view);
  else if (state.tab === 'trans') renderTranslateView(view);
  else if (state.tab === 'num') renderNumView(view);
  else renderFavView(view);
  $$('.tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));
  syncGlobalInput();
  main.scrollTop = 0;
}

/* ---------- 字号 ---------- */
const FS_NAME = ['标准', '大', '特大'];
function applyFs() {
  const m = $('#main');
  m.classList.toggle('fs1', state.opt.fs === 1);
  m.classList.toggle('fs2', state.opt.fs === 2);
  const b = $('#fsBtn');
  if (b) b.textContent = '字号 ' + FS_NAME[state.opt.fs];
}

function init() {
  $('#verTag').textContent = 'V' + APP_VER;
  document.title = '华越畅行 V' + APP_VER;
  $$('.tabbar button').forEach(b => {
    b.onclick = () => {
      const t = b.dataset.tab;
      if (t !== 'search') state.q = '';
      if (t === 'scene') state.sceneOpen = false;
      state.tab = t;
      renderTab();
    };
  });
  const g = $('#qGlobal'), c = $('#qClr');
  if (g) {
    let tm = null;
    g.oninput = () => { clearTimeout(tm); tm = setTimeout(onGlobalSearch, 200); };
    g.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); g.blur(); onGlobalSearch(); } };
    g.value = state.q;
  }
  if (c) c.onclick = () => { if (g) g.value = ''; state.q = ''; onGlobalSearch(); };
  $('#fsBtn').onclick = () => {
    state.opt.fs = (state.opt.fs + 1) % 3;
    saveOpt();
    applyFs();
    toast('字号已切换为「' + FS_NAME[state.opt.fs] + '」，本机记住');
  };
  applyFs();
  renderTab();
}
document.addEventListener('DOMContentLoaded', init);

</script>

/* 底部徽标安全带：Netlify 徽标渲染在隔离节点里，页面脚本读不到它，
   上一版靠 DOM 检测会漏判。改为不依赖检测——默认给 #app 留出 46px，
   徽标固定在这段留白里，底部导航的六个按钮始终在其上方。
   仅在我们的演示域名与本地预览下取消，避免多余空白。 */
(function () {

  if (/workbuddy\.host$/i.test(h) || h === 'localhost' || h === '127.0.0.1') {
    document.documentElement.style.setProperty('--nbres', '0px');
  }
})();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
